  <head><meta charset="UTF-8"/><title>縦書き・基本表示</title><link rel="stylesheet" type="text/css" href="style.css"/></head>
  <body>
    <section id="B01">
      <h1>01　縦書き・基本表示</h1>
      <p class="info">検証内容：文字の縦方向の進行、右から左への行進行、句読点の配置を確認する。</p>
      <p class="expected">ケースID：B01。期待結果：文字は上から下、行は右から左へ進む。句読点と括弧が縦組みの向きで表示される。 判定区分・記録方法は第25章。</p>
      <p class="sample">夕暮れの観測所で、星の航路を静かに記録した。雲の向こうには、遠い銀河が瞬いている。日本語の句読点「、」「。」、括弧「（）」、鉤括弧「『』」が正しい向きと位置で表示されるかを調べる。</p>
      <p>数字123、英字ABC、記号!?&amp; の方向も比較する。</p>
    </section>
  </body>
</html>
