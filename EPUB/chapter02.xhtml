      <p class="info">検証内容：色、太字、下線、字間、背景など、基本的なスタイルを適用する。</p>
      <p class="expected">ケースID：B02。期待結果：各指定の色・太字・下線・字間・背景が反映される。emの字体は使用フォントの差を許容する。 判定区分・記録方法は第25章。</p>
