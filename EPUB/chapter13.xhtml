      <h1>13　ルビと圏点の併用</h1>
      <p class="info">検証内容：同じ親文字へのルビと圏点の競合を検証する。</p>
      <p class="expected">ケースID：B13。期待結果：同じ側のルビと圏点の配置を観察する。衝突と機能未対応を分けて記録する。 判定区分・記録方法は第25章。</p>
      <p><ruby class="emphasis"><rb>星空</rb><rt>ほしぞら</rt></ruby>を見上げた。<ruby class="emphasis-red"><rb>流星群</rb><rt>りゅうせいぐん</rt></ruby>を追った。</p>
      <p class="info">ルビと圏点を同時に適用する意図的なストレスケース。レンダラーによって装飾が競合する可能性がある。</p>
